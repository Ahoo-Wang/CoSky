spring:
  application:
    # What the instance registers as, and what the consumer calls.
    name: provider
  config:
    # optional: the application still starts if the Config is not there; it refreshes when it appears.
    import: "optional:cosky:provider.yaml"
  cloud:
    # Spring Cloud 2025.1 declares Spring Boot 4.0, and this runs on 4.1. Spring Cloud 2026.0 will declare it.
    compatibility-verifier:
      enabled: false
server:
  port: 8081
cosky:
  endpoints: localhost:9090
  namespace: default
