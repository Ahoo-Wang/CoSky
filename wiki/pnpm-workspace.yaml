allowBuilds:
  esbuild: true

# Security fixes, forcing patched transitive dependencies until upstream widens its ranges.
# - vite: VitePress 1.x depends on vite 5, which no longer gets security fixes.
# - katex: only used by mermaid, for math in diagrams, which this site does not use.
overrides:
  vite: ^6.4.4
  katex: ^0.19.0
