schema_version: "1.1"
name: connect-webflux-service-to-dev
expected_outcome: |
  The project builds on the CoSky 8.0.0-beta.9 BOM with cosky-spring-boot-starter, Spring Cloud 2026.0,
  spring-cloud-context and the load balancer. application.yaml imports cosky:order-service.yaml and holds
  cosky.endpoints (the gRPC port 9090) and cosky.namespace dev in the same file. The token reaches the
  application from a Kubernetes Secret, preferably mounted as a directory and read with cosky.token-file,
  and no token is written into any file. OrderController calls payment-service by name through a
  @LoadBalanced client. NOTES.md explains that the dev namespace's own account (ServiceAccount dev) has one
  token all dev services share, which an admin creates once in the Dashboard (Connect) or with
  POST /v1/serviceaccounts/dev/tokens.
context:
  scaffold_script: place-files.sh
