name: Docker Image Deploy
on:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'main'
  # Dispatched by the Release workflow on the release tag.
  workflow_dispatch:
jobs:
  docker-deploy:
    name: Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
          run_install: false

      - name: Set up NodeJs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install Packages
        working-directory: dashboard
        run: pnpm install

      - name: Lint Dashboard-UI
        working-directory: dashboard
        run: pnpm lint

      - name: Build Dashboard-UI
        working-directory: dashboard
        run: pnpm build

      - name: Test Dashboard-UI Units
        working-directory: dashboard
        run: pnpm test:unit

      - name: Install Playwright Chromium
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium

      # The Playwright suite is flaky, on main as well. It reports without failing the job until the Dashboard moves to
      # the 8.0 API (roadmap W4b).
      - name: Test Dashboard-UI with coverage
        working-directory: dashboard
        continue-on-error: true
        run: pnpm test:coverage

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Build Dist
        run: ./gradlew :server:installDist

      - name: Smoke test the image
        run: |
          docker build -t cosky-server:test server
          docker run -d --name cosky -p 8080:8080 cosky-server:test --dev
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health/readiness
          curl -sf http://localhost:8080/v1/namespaces/default/configs
          docker stop --time 15 cosky
          docker logs cosky | tail -5
          # 143 is the JVM's exit on SIGTERM: anything else means it had to be killed.
          status="$(docker inspect cosky --format '{{.State.ExitCode}}')"
          test "$status" = 143 -o "$status" = 0

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to AliyunCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_TOKEN }}

      - name: Docker meta
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ahoowang/cosky
            ghcr.io/ahoo-wang/cosky
            registry.cn-shanghai.aliyuncs.com/ahoo/cosky
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Only a release tag publishes an image; 8.0 stays off the registries until its first beta (roadmap section 1).
      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          platforms: linux/amd64,linux/arm64
          context: server
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
