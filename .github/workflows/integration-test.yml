# Builds and verifies every module: compilation, unit and integration tests against Redis, static analysis,
# license headers and the coverage floor.
# Every Gradle run goes through retry-on-network-error.sh: Maven Central answers 429 now and then, which Gradle's own
# retries do not outlast, and a check that fails for it says nothing about the pull request.
name: Integration Test
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    # A run takes about 20 minutes. A hang should fail in an hour, not in GitHub's six.
    timeout-minutes: 60
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          # The server's tests run on 25; the last one listed runs Gradle.
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Integration Test
        run: .github/scripts/retry-on-network-error.sh ./gradlew clean check

      # A test that times out leaves every thread's stack in its report.
      - name: Keep the test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

  # The Kotlin API that 8.0.0-rc.1 freezes (CONTRIBUTING.md). A pull request that changes it updates the dumps
  # (`./gradlew updateKotlinAbi`), so the change shows in review; and no line of the base's dumps may go, which updating
  # them cannot get past. That warns until the base is a release candidate, and fails from then on.
  abi-compatibility:
    name: ABI Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Checkout the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Kotlin API
        run: .github/scripts/retry-on-network-error.sh ./gradlew checkKotlinAbi

      - name: The Kotlin API only grows
        if: github.event_name == 'pull_request'
        run: .github/scripts/api-only-grows.sh .base

  # REST, which 8.0.0-rc.1 freezes as well (CONTRIBUTING.md): oasdiff compares the OpenAPI documents of the base and of
  # the pull request, routes, parameters, headers, status codes and schemas. buf guards the protos; this guards what
  # only REST has. It warns until the base is a release candidate, and fails from then on.
  rest-compatibility:
    name: REST Compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Checkout the base
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: OpenAPI documents
        run: |
          .github/scripts/retry-on-network-error.sh ./gradlew :api:generateOpenApi
          cd .base && ../.github/scripts/retry-on-network-error.sh ./gradlew :api:generateOpenApi

      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.38.0
          OASDIFF_SHA256: 613037fd6a1d3362a1b742d6d86c338c0eb5ab3511f4942ce3948e78720ea2da
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: REST only grows
        run: .github/scripts/rest-only-grows.sh .base

  # From 8.0.0-rc.1 to 8.0.0 the properties and the documented metrics only grow too (CONTRIBUTING.md): the
  # configuration metadata and the deployment guide's table of metrics, compared with those of the base. Before the
  # release candidate it only warns.
  names-compatibility:
    name: Properties and Metrics Compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Checkout the base
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Properties and metrics only grow
        run: .github/scripts/names-only-grow.sh .base

  # From 8.0.0-rc.1 to 8.0.0 the gRPC API only grows (CONTRIBUTING.md): buf compares the protos with the base of the
  # pull request, by the rules in api/src/main/proto/buf.yaml. Before the release candidate it only warns.
  proto-compatibility:
    name: Proto Compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Checkout the base
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Breaking changes
        run: .github/scripts/proto-only-grows.sh .base

  # The versions design D31 promises, beyond the one every other test runs on.
  redis-compatibility:
    name: Redis Compatibility (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - redis:7.0-alpine
          - redis:8.12-alpine
          - valkey/valkey:8-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          cache: gradle

      - name: Store on ${{ matrix.image }}
        run: .github/scripts/retry-on-network-error.sh ./gradlew :store-redis:test
        env:
          COSKY_REDIS_IMAGE: ${{ matrix.image }}
