# Creates the GitHub release, or a pre-release, when a version bump reaches main (roadmap section 1),
# then starts the publishing workflows.
# A release or tag created with GITHUB_TOKEN does not trigger other workflows, so they are dispatched explicitly
# (workflow_dispatch is exempt from that rule). Releases created by hand still trigger them as before.
# Running it again finishes a release it left half done: it creates the release if it is missing, and starts each
# publishing workflow that has not run on the tag.
name: Release
on:
  push:
    branches: [ main ]
    paths: [ gradle.properties ]
  # For a version already on main, which no bump of gradle.properties will start.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: release
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Create release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Version '$version' is not a release version, nothing to do."
            exit 0
          fi
          latest=(--latest)
          if [[ "$version" == *-* ]]; then
            latest=(--prerelease --latest=false)
          fi
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $tag exists."
          else
            # A pre-release's notes start from the newest release of its major version, a stable release's from the
            # stable release before it, so that 8.0.0 lists all of 8.0 and not only what came after the last rc
            # (previous-release.sh says why). The latest stable release is a fallback, should the list fail.
            previous="$(gh release list --repo "$REPO" --exclude-drafts --limit 100 --json tagName -q '.[].tagName' \
              2> /dev/null | .github/scripts/previous-release.sh "$version" || true)"
            if [[ -z "$previous" ]]; then
              previous="$(gh release view --repo "$REPO" --json tagName -q .tagName 2> /dev/null || true)"
            fi
            args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
            if [[ -n "$previous" ]]; then
              args+=(-f previous_tag_name="$previous")
            fi
            gh api "repos/$REPO/releases/generate-notes" "${args[@]}" -q .body > generated-notes.md

            # Optional hand-written introduction, e.g. highlights and upgrade notes.
            intro=".github/release-notes/${tag}.md"
            { if [[ -f "$intro" ]]; then cat "$intro"; echo; fi; cat generated-notes.md; } > release-notes.md

            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md "${latest[@]}"
          fi

          # Each publishing workflow runs once on the tag. One that never started, say since this job stopped before
          # it, starts now. One that failed is re-run instead: it may have published part of the release already,
          # which cannot be published twice.
          failed=0
          for workflow in package-deploy.yml docker-deploy.yml; do
            state="$(gh run list --repo "$REPO" --workflow "$workflow" --branch "$tag" --limit 20 \
              --json databaseId,status,conclusion \
              --jq 'if length == 0 then "none"
                elif any(.[]; .status != "completed" or .conclusion == "success") then "running or done"
                else "failed \(.[0].databaseId)" end')"
            case "$state" in
              none)
                gh workflow run "$workflow" --repo "$REPO" --ref "$tag"
                echo "Started $workflow on $tag."
                ;;
              "running or done")
                echo "$workflow is running on $tag, or has run."
                ;;
              *)
                echo "::error::$workflow failed on $tag. Re-run it: gh run rerun ${state#failed } --failed --repo $REPO"
                failed=1
                ;;
            esac
          done
          exit "$failed"
