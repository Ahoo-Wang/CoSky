# Creates the GitHub release, or a pre-release, when a version bump reaches main (roadmap section 1),
# then starts the publishing workflows.
# A release or tag created with GITHUB_TOKEN does not trigger other workflows, so they are dispatched explicitly
# (workflow_dispatch is exempt from that rule). Releases created by hand still trigger them as before.
name: Release
on:
  push:
    branches: [ main ]
    paths: [ gradle.properties ]
  # For a version already on main, which no bump of gradle.properties will start.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: release
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Create release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Version '$version' is not a release version, nothing to do."
            exit 0
          fi
          latest=(--latest)
          if [[ "$version" == *-* ]]; then
            latest=(--prerelease --latest=false)
          fi
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi

          # The newest release of this major version, pre-releases included; gh release view only knows the latest
          # stable one, which would be 6.x for all of 8.0.
          major="${version%%.*}"
          previous="$(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' 2> /dev/null \
            | grep -m1 "^v${major}\." || gh release view --repo "$REPO" --json tagName -q .tagName 2> /dev/null || true)"
          args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
          if [[ -n "$previous" ]]; then
            args+=(-f previous_tag_name="$previous")
          fi
          gh api "repos/$REPO/releases/generate-notes" "${args[@]}" -q .body > generated-notes.md

          # Optional hand-written introduction, e.g. highlights and upgrade notes.
          intro=".github/release-notes/${tag}.md"
          { if [[ -f "$intro" ]]; then cat "$intro"; echo; fi; cat generated-notes.md; } > release-notes.md

          gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md "${latest[@]}"
          gh workflow run package-deploy.yml --repo "$REPO" --ref "$tag"
          gh workflow run docker-deploy.yml --repo "$REPO" --ref "$tag"
