# Smoke-tests the packaged REST API server built from this change: its start script, bootstrap configuration and
# security setup. The HTTP behavior itself is covered by RestApiIntegrationTest.
name: REST API Test
on:
  push:
    branches: [ v6 ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  REST-API-Test:
    name: REST API Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Distribution
        run: ./gradlew cosky-rest-api:installDist
      - name: Start REST API Server
        working-directory: cosky-rest-api/build/install/cosky-rest-api
        env:
          # Throwaway secret for this ephemeral server: it refuses to start without one.
          COSKY_SECURITY_KEY: rest-api-test-only-jwt-secret-0123456789
        run: |
          mkdir -p logs
          nohup bin/cosky-rest-api > server.out 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat server.out
          exit 1
      - name: Smoke Test
        run: |
          curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'
          # Protected endpoints must reject anonymous requests.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/namespaces/cosky-%7Bdefault%7D/configs)" = 401
      - name: Server Log
        if: failure()
        run: cat cosky-rest-api/build/install/cosky-rest-api/server.out
