spring:
  application:
    name: cosky-server
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      port: 9090
      # It answers without a token, unlike the services it describes.
      reflection:
        enabled: false
      shutdown:
        # Watches and keep-alives never finish by themselves, so a shutdown would always wait this long. Clients
        # reconnect to another replica when it ends them.
        grace-period: 5s
      keepalive:
        permit:
          # Clients ping every 15 seconds to notice a server that is silently gone. gRPC ends the connections of those
          # it finds pinging more often than this, 5 minutes by default.
          time: 10s
  http:
    codecs:
      # A Config of 1 MiB, or an archive of them.
      max-in-memory-size: 64MB
management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Those who embed the server's classes in their tests do not have the contributor below.
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,coSkyReadiness
cosky:
  auth:
    # Design 6.3: the first start creates the admin ServiceAccount from it.
    bootstrap-token: ${COSKY_BOOTSTRAP_TOKEN:}
