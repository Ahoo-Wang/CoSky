spring:
  application:
    name: cosky-server
  threads:
    virtual:
      enabled: true
  lifecycle:
    # REST watches, as the Dashboard keeps open, never finish by themselves either: the web server's graceful shutdown
    # would wait the 30 seconds of the default, past the 25 seconds Kubernetes gives a pod. Clients open them again
    # on another replica.
    timeout-per-shutdown-phase: 5s
  grpc:
    server:
      port: 9090
      # It answers without a token, unlike the services it describes.
      reflection:
        enabled: false
      shutdown:
        # Watches and keep-alives never finish by themselves, so a shutdown would always wait this long. Clients
        # reconnect to another replica when it ends them.
        grace-period: 5s
      keepalive:
        permit:
          # Clients ping every 15 seconds to notice a server that is silently gone. gRPC ends the connections of those
          # it finds pinging more often than this, 5 minutes by default.
          time: 10s
        connection:
          # A client keeps its one connection for good, so after a rolling update or a scale-out the replicas that
          # started last have few clients. Ending each connection after about half an hour, give or take a tenth,
          # spreads them again: a client reconnects through the Service and resumes where it was.
          max-age: 30m
          # Watches and keep-alives never finish by themselves, as on shutdown.
          grace-period: 5s
  webflux:
    # Failures that are not CoSky's own, such as a path that does not exist, are problem details (RFC 9457) as well.
    problemdetails:
      enabled: true
  http:
    codecs:
      # A Config of 1 MiB, or an archive of them.
      max-in-memory-size: 64MB
# springdoc serves the REST API's document as generated from the protos, at /v3/api-docs and in Swagger UI at
# /swagger-ui.html, and keeps all its schemas: the protos' messages, beside those the paths name.
springdoc:
  remove-broken-reference-definitions: false
  # On by default, which springdoc would otherwise warn of at every start; see Security for turning them off.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Those who embed the server's classes in their tests do not have the contributor below.
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,coSkyReadiness
cosky:
  auth:
    # Design 6.3: the first start creates the admin ServiceAccount from it.
    bootstrap-token: ${COSKY_BOOTSTRAP_TOKEN:}
