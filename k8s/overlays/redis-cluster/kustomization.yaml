# The same server on a Redis Cluster: kubectl apply -k k8s/overlays/redis-cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: cosky
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: COSKY_STORE_REDIS_CLUSTER
          value: "true"
