# The CoSky server (design 7.4), which keeps its data in Redis and nothing on disk, so replicas come and go freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosky
  labels:
    app: cosky
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      # One at a time: clients of a stopping replica reconnect to the others, and can resume where they were (D29).
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cosky
  template:
    metadata:
      labels:
        app: cosky
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      # The gRPC grace period is 5 seconds, and the rest is for the JVM to stop.
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cosky
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: cosky
          # The tag comes from kustomization.yaml.
          image: ahoowang/cosky
          env:
            - name: COSKY_STORE_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: cosky-redis
                  key: uri
            # Only read on the first start, while no RoleBinding exists; it may be removed afterwards.
            - name: COSKY_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cosky-auth
                  key: bootstrap-token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              port: http
              path: /actuator/health/liveness
            periodSeconds: 2
            failureThreshold: 60
          # Ready once every namespace has loaded; asking also starts the loading (design 7.9).
          readinessProbe:
            httpGet:
              port: http
              path: /actuator/health/readiness
            periodSeconds: 2
          livenessProbe:
            httpGet:
              port: http
              path: /actuator/health/liveness
          resources:
            # About 1 KB per instance and per watch on top of the JVM (design 7.10); size the limit to the fleet.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
