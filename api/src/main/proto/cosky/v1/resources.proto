syntax = "proto3";

// Resource CRUD (design §4.3, semantics in §7.1).
package cosky.v1;

import "cosky/v1/resource.proto";

option java_multiple_files = true;
option java_package = "me.ahoo.cosky.api.v1";
option java_outer_classname = "ResourcesProto";

service ResourceService {
  rpc Get(GetRequest) returns (Resource);
  rpc List(ListRequest) returns (ListResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc History(HistoryRequest) returns (HistoryResponse); // Config only
}

message GetRequest {
  ResourceKey key = 1;
  int64 min_revision = 2; // read-your-writes
}

message ListRequest {
  string namespace = 1;
  Kind kind = 2;
  map<string, string> label_selector = 3; // equality only, all conditions ANDed
  string service = 4; // Instance filter
  int64 min_revision = 5;
  int32 page_size = 6; // 0 = default (500); at most 1000; a page may hold fewer to stay within the size cap (§4.6)
  string page_token = 7; // next_page_token of the previous page; empty = the first page
}

message ListResponse {
  repeated Resource items = 1;
  int64 revision = 2; // of the first page, on every page; Watch from it to converge (§4.6)
  string epoch = 3; // the timeline of revision; revisions compare only within one epoch (§6.4)
  string next_page_token = 4; // empty = the last page
}

message PutRequest {
  Resource resource = 1;
  int64 expected_revision = 2; // 0 = no check; -1 = must not exist; > 0 = compare-and-set
}

message PutResponse {
  int64 revision = 1;
  bool changed = 2; // false when the content is unchanged: no new revision, no event
}

message DeleteRequest {
  ResourceKey key = 1;
  int64 expected_revision = 2;
}

message DeleteResponse {
  int64 revision = 1;
  bool deleted = 2;
}

message HistoryRequest {
  ResourceKey key = 1;
  int32 limit = 2;
  string page_token = 3; // next_page_token of the previous page; empty = the first page
}

message HistoryResponse {
  repeated Resource revisions = 1; // newest first
  string next_page_token = 2; // empty = the last page
}
