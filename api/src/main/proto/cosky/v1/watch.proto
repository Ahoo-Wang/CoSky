syntax = "proto3";

// Resumable watch (design §4.3, semantics in §7.3).
package cosky.v1;

import "cosky/v1/errors.proto";
import "cosky/v1/resource.proto";

option java_multiple_files = true;
option java_package = "me.ahoo.cosky.api.v1";
option java_outer_classname = "WatchProto";

service WatchService {
  rpc Watch(stream WatchRequest) returns (stream WatchResponse); // one stream multiplexes many watches
}

message WatchRequest {
  oneof request {
    Create create = 1;
    Cancel cancel = 2;
  }
  message Create {
    int64 watch_id = 1; // assigned by the client
    string namespace = 2;
    Kind kind = 3;
    string name = 4; // empty = every object of the kind
    string service = 5; // Instance filter by service
    int64 from_revision = 6; // 0 = send the current snapshot first, then the increments
    string from_epoch = 7; // required when from_revision > 0; a different epoch gets gone (§7.3)
  }
  message Cancel {
    int64 watch_id = 1;
  }
}

message WatchResponse {
  // gone was a bare int64, the earliest resumable revision; position_gone replaces it.
  reserved 5;
  reserved "gone";

  int64 watch_id = 1;
  oneof payload {
    Snapshot snapshot = 2; // initial state when from_revision = 0
    Events events = 3; // events of one revision, in one or more messages
    int64 progress = 4; // bookmark: the revision caught up to, sent periodically while idle
    Canceled canceled = 6; // the server ended this watch; the stream and its other watches go on
    Gone position_gone = 7; // the watch cannot go on from its position: List again, or watch from a snapshot (§7.3)
  }
  message Snapshot {
    repeated Resource items = 1;
    int64 revision = 2;
    string epoch = 3; // the timeline of revision; revisions compare only within one epoch (§6.4)
    bool more = 4; // more chunks of this snapshot follow; no events arrive before the last one (§4.6)
  }
  message Events {
    int64 revision = 1;
    repeated Event events = 2;
    bool more = 3; // more events of this revision follow; apply them together once the last arrives (§4.6)
  }
  // The position of the watch, (from_epoch, from_revision) or what it delivered since, is gone. The watch ends; the
  // stream and its other watches go on.
  message Gone {
    int64 earliest_revision = 1; // the earliest revision the namespace can be resumed from now, in epoch
    string epoch = 2; // the namespace's timeline now (§6.4)
    GoneReason reason = 3;
  }
  // Ends one watch without closing the stream: the Create was rejected (e.g. WATCH_QUOTA_EXCEEDED), the namespace was
  // deleted (NAMESPACE_NOT_FOUND) or the subject lost permission (PERMISSION_DENIED), see §7.2 and §7.3.
  message Canceled {
    string message = 1;
    ErrorDetail detail = 2;
  }
  message Event {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_PUT = 1;
      TYPE_DELETE = 2;
    }
    Type type = 1;
    Resource resource = 2; // for DELETE: the spec before deletion; revision, updated_at, updated_by of the delete
  }
}

// Why a watch's position is gone; cosky_watch_gone_total counts COMPACTED through REGRESSION (§7.9).
enum GoneReason {
  GONE_REASON_UNSPECIFIED = 0; // none of the reasons below
  GONE_REASON_COMPACTED = 1; // from_revision was older than the window when it was created
  GONE_REASON_SLOW = 2; // it fell out of the window while following
  GONE_REASON_EPOCH = 3; // another epoch began: the namespace was created again, or its timeline replaced (§6.4)
  GONE_REASON_REGRESSION = 4; // from_revision is beyond what the store holds: it came from a timeline that was lost
  GONE_REASON_PERMISSION = 5; // what the subject may see changed, so the watch restarts from a snapshot (§7.3)
}
