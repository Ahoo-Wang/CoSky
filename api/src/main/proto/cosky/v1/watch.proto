syntax = "proto3";

// Resumable watch (design §4.3, semantics in §7.3).
package cosky.v1;

import "cosky/v1/errors.proto";
import "cosky/v1/resource.proto";

option java_multiple_files = true;
option java_package = "me.ahoo.cosky.api.v1";
option java_outer_classname = "WatchProto";

service WatchService {
  rpc Watch(stream WatchRequest) returns (stream WatchResponse); // one stream multiplexes many watches
}

message WatchRequest {
  oneof request {
    Create create = 1;
    Cancel cancel = 2;
  }
  message Create {
    int64 watch_id = 1; // assigned by the client
    string namespace = 2;
    Kind kind = 3;
    string name = 4; // empty = every object of the kind
    string service = 5; // Instance filter by service
    int64 from_revision = 6; // 0 = send the current snapshot first, then the increments
    string from_epoch = 7; // required when from_revision > 0; a different epoch gets gone (§7.3)
  }
  message Cancel {
    int64 watch_id = 1;
  }
}

message WatchResponse {
  int64 watch_id = 1;
  oneof payload {
    Snapshot snapshot = 2; // initial state when from_revision = 0
    Events events = 3; // events of one revision, in one or more messages
    int64 progress = 4; // bookmark: the revision caught up to, sent periodically while idle
    // (from_epoch, from_revision) cannot be resumed; the earliest resumable revision, the client must List again.
    int64 gone = 5;
    Canceled canceled = 6; // the server ended this watch; the stream and its other watches go on
  }
  message Snapshot {
    repeated Resource items = 1;
    int64 revision = 2;
    string epoch = 3; // the timeline of revision; revisions compare only within one epoch (§6.4)
    bool more = 4; // more chunks of this snapshot follow; no events arrive before the last one (§4.6)
  }
  message Events {
    int64 revision = 1;
    repeated Event events = 2;
    bool more = 3; // more events of this revision follow; apply them together once the last arrives (§4.6)
  }
  // Ends one watch without closing the stream: the Create was rejected (e.g. WATCH_QUOTA_EXCEEDED), the namespace was
  // deleted (NAMESPACE_NOT_FOUND) or the subject lost permission (PERMISSION_DENIED), see §7.2 and §7.3.
  message Canceled {
    string message = 1;
    ErrorDetail detail = 2;
  }
  message Event {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_PUT = 1;
      TYPE_DELETE = 2;
    }
    Type type = 1;
    Resource resource = 2; // for DELETE: the spec before deletion; revision, updated_at, updated_by of the delete
  }
}
