syntax = "proto3";

// Leases: instance liveness (design §4.3, §6.2).
package cosky.v1;

option java_multiple_files = true;
option java_package = "me.ahoo.cosky.api.v1";
option java_outer_classname = "LeasesProto";

// Grant needs PUT on INSTANCE in the namespace; KeepAlive and Revoke are for the subject that granted the lease (§7.8).
service LeaseService {
  rpc Grant(GrantRequest) returns (GrantResponse);
  // A stream that ends with UNAVAILABLE says nothing about the lease; only ttl_seconds = 0 means it is gone (§6.2).
  rpc KeepAlive(stream KeepAliveRequest) returns (stream KeepAliveResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
}

message GrantRequest {
  string namespace = 1;
  int32 ttl_seconds = 2; // 0 = default (30); otherwise within [5, 300]
}

message GrantResponse {
  int64 lease = 1;
  int32 ttl_seconds = 2;
}

message KeepAliveRequest {
  string namespace = 1;
  int64 lease = 2;
}

message KeepAliveResponse {
  int64 lease = 1;
  int32 ttl_seconds = 2; // 0 = the lease no longer exists
}

message RevokeRequest {
  string namespace = 1;
  int64 lease = 2;
}

message RevokeResponse {}
