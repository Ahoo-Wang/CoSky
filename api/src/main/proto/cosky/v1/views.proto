syntax = "proto3";

// Derived read-only views, computed from the server's watch cache and never stored (design §4.3).
// The design only names the RPCs; these messages are the minimal shape the Dashboard needs.
package cosky.v1;

option java_multiple_files = true;
option java_package = "me.ahoo.cosky.api.v1";
option java_outer_classname = "ViewsProto";

service ViewService {
  rpc Services(ServicesRequest) returns (ServicesResponse); // services with instance counts
  rpc Topology(TopologyRequest) returns (TopologyResponse); // consumer -> producer edges
  rpc Stats(StatsRequest) returns (StatsResponse);
}

message ServicesRequest {
  string namespace = 1;
  // 0 = no limit: every service, in as few pages as the size cap allows; otherwise at most 1000. A page may hold fewer
  // to stay within the size cap (§4.6).
  int32 page_size = 2;
  string page_token = 3; // next_page_token of the previous page; empty = the first page
}

message ServicesResponse {
  repeated ServiceSummary services = 1; // ordered by service name
  int64 revision = 2; // namespace revision the first page was computed at, on every page; later pages are no older
  string next_page_token = 3; // empty = the last page
}

// A service is the group of instances sharing InstanceSpec.service.
message ServiceSummary {
  string service = 1;
  int32 instance_count = 2;
}

message TopologyRequest {
  string namespace = 1;
  // 0 = no limit: every edge, in as few pages as the size cap allows; otherwise at most 1000. A page may hold fewer
  // to stay within the size cap (§4.6).
  int32 page_size = 2;
  string page_token = 3; // next_page_token of the previous page; empty = the first page
}

// Edges are recorded from live watches: a client watching the instances of one service consumes it (§6.3). They are
// soft state, read again for each page: an edge may come or go between pages.
message TopologyResponse {
  repeated TopologyEdge edges = 1; // ordered by consumer, then producer
  string next_page_token = 2; // empty = the last page
}

message TopologyEdge {
  string consumer = 1; // the name the client gave itself, or else the authenticated subject (design D30)
  string producer = 2; // watched service
}

message StatsRequest {
  string namespace = 1;
}

message StatsResponse {
  int32 service_count = 1;
  int32 instance_count = 2;
  int32 config_count = 3;
  int64 revision = 4; // namespace revision the counts were computed at
}
