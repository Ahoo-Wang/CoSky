coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    project:
      default:
        # Coverage must not drop by more than the noise of a single run.
        target: auto
        threshold: 0.5%
    patch:
      default:
        # Changed lines are held to a higher bar than the project as a whole.
        target: 80%
        threshold: 1%
ignore:
  - "test/.*"
