# Builds upon the default detekt configuration: only deviations are listed, each with its reason.
complexity:
  LongParameterList:
    # Reactive pipelines and REST query endpoints take their options as parameters with defaults.
    active: false
  TooManyFunctions:
    # Services implement wide but cohesive interfaces (e.g. ServiceRegistry, ConfigService).
    active: false
style:
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # Guard clauses with early returns are preferred over nested conditionals.
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
  WildcardImport:
    excludeImports:
      - java.util.*
      - org.hamcrest.Matchers.*
naming:
  MemberNameEqualsClassName:
    # CoSky.COSKY is a published constant.
    active: false
performance:
  SpreadOperator:
    # Only used to forward main(args) to Spring, once at startup.
    active: false
formatting:
  NoWildcardImports:
    packagesToUseImportOnDemandProperty: "java.util.*,org.hamcrest.Matchers.*"
  MaximumLineLength:
    maxLineLength: 120
comments:
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license.template'
