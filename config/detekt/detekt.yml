# Builds upon the default detekt configuration: only deviations are listed, each with its reason.
complexity:
  LongParameterList:
    # Reactive pipelines and REST query endpoints take their options as parameters with defaults.
    active: false
  TooManyFunctions:
    # Services implement wide but cohesive interfaces (e.g. ServiceRegistry, ConfigService).
    active: false
style:
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # Guard clauses with early returns are preferred over nested conditionals.
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
  ForbiddenImport:
    # Core layers are coroutines-only; Reactor may appear only in the adapter layers listed in `excludes`
    # (design D9, §3.2). The excluded modules are matched by path, so the rule covers them as soon as they exist.
    active: true
    imports:
      - value: 'reactor.*'
        reason: 'Use suspend/Flow/StateFlow; Reactor is allowed only in store-redis, spring-boot-starter and server adapters.'
      - value: 'kotlinx.coroutines.reactor.*'
        reason: 'The Reactor bridge belongs to the adapter layers (store-redis, spring-boot-starter, server adapters).'
    excludes:
      - '**/store-redis/src/**'
      - '**/spring-boot-starter/src/**'
      - '**/server/src/*/kotlin/**/adapter/**'
  WildcardImport:
    excludeImports:
      - java.util.*
      - org.hamcrest.Matchers.*
naming:
  MemberNameEqualsClassName:
    # CoSky.COSKY is a published constant.
    active: false
performance:
  SpreadOperator:
    # Only used to forward main(args) to Spring, once at startup.
    active: false
formatting:
  NoWildcardImports:
    packagesToUseImportOnDemandProperty: "java.util.*,org.hamcrest.Matchers.*"
  MaximumLineLength:
    maxLineLength: 120
comments:
  AbsentOrWrongFileLicense:
    active: true
    licenseTemplateFile: 'license.template'
