server:
  compression:
    enabled: true
spring:
  cloud:
    cosky:
      discovery:
        # Dashboard reads are administrative and must not show up as service dependencies.
        topology-enabled: false
        registry:
          weight: 8

  web:
    resources:
      static-locations: file:./dashboard/dist/
cosky:
  security:
    enabled: true
    audit-log:
      action: write
    enforce-init-super-user: ${cosky.super.init:false}

cosec:
  jwt:
    algorithm: hmac256
    # Required when security is enabled: set cosky.security.key (env COSKY_SECURITY_KEY) to a random secret.
    secret: ${cosky.security.key:}
    token-validity:
      access: 15m
      refresh: 3H

cosid:
  namespace: ${spring.application.name}
  machine:
    enabled: true
    distributor:
      type: redis
  generator:
    enabled: true

simba:
  redis:
    enabled: true
logging:
  file:
    name: logs/${spring.application.name}.log
